<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำข้อสอบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- MathJax สำหรับสมการคณิตศาสตร์ -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  <div class="exam-header">
    <div class="exam-header-inner">
      <div>
        <div style="font-weight:700;" id="examTitle">กำลังโหลด...</div>
        <div class="muted" id="studentName" style="font-size:14px;"></div>
      </div>
      <div class="timer hidden" id="timer">--:--</div>
    </div>
  </div>

  <div class="container" style="max-width:820px;">
    <div id="loading" class="loader"><div class="spinner"></div>กำลังโหลดข้อสอบ...</div>

    <div id="examArea" class="hidden">
      <div class="qnav" id="qnav"></div>
      <div class="question-box" id="questionBox"></div>
      <div class="exam-footer">
        <button class="btn btn-ghost" id="prevBtn">← ก่อนหน้า</button>
        <button class="btn" id="nextBtn">ถัดไป →</button>
        <button class="btn btn-success" id="submitBtn">ส่งข้อสอบ</button>
      </div>
    </div>

    <div id="errorArea" class="hidden"></div>
  </div>

  <!-- Modal ยืนยันส่ง -->
  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal">
      <h2>ยืนยันการส่งข้อสอบ</h2>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeConfirm()">ทำต่อ</button>
        <button class="btn btn-success" id="confirmSubmit">ส่งข้อสอบ</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>

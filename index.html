<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสอบออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo">📝</div>
      <h1>ระบบสอบออนไลน์</h1>
      <p class="sub" data-school-name>โรงเรียนบ้านใหม่</p>

      <div id="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="studentId">รหัสนักเรียน</label>
          <input type="text" id="studentId" placeholder="เช่น S0001" autocomplete="off"
                 autocapitalize="characters" required>
        </div>
        <button type="submit" class="btn btn-lg" id="loginBtn">เข้าสู่ระบบ</button>
      </form>

      <p class="mt-3">
        <a href="teacher.html" class="muted" style="font-size:14px;">🔑 สำหรับครู / ผู้ดูแลระบบ</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById('alert');
    function showAlert(msg, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    // ถ้าล็อกอินอยู่แล้ว ไปหน้านักเรียนเลย
    if (Auth.getStudent()) location.href = 'student.html';

    applyPublicConfig();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const studentId = document.getElementById('studentId').value.trim();
      if (!studentId) return;
      btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
      alertBox.innerHTML = '';
      try {
        const data = await API.call('studentLogin', { studentId }, { retry: 1 });
        Auth.setStudent(data.student);
        // เก็บรายการข้อสอบ + ผลสอบไว้ให้หน้า student ใช้ทันที (ลด request)
        sessionStorage.setItem('exam_list', JSON.stringify(data.exams || []));
        sessionStorage.setItem('exam_results', JSON.stringify(data.results || []));
        location.href = 'student.html';
      } catch (err) {
        showAlert(err.message || 'เข้าสู่ระบบไม่สำเร็จ');
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
